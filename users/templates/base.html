<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IUCA Community{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Шапка сайта */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a252f;
            padding: 12px 24px;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffffff;
            text-decoration: none;
        }

        /* По центру меню (задел на будущее) */
        .navbar-menu {
            display: flex;
            gap: 20px;
        }

        .navbar-menu a {
            color: #b8c7ce;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .navbar-menu a:hover {
            color: #ffffff;
        }

        /* Правый верхний угол (Профиль и действия) */
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        /* Основной контент страницы */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <!-- Лево: Логотип / Название -->
        <a href="{% url 'profile' %}" class="navbar-brand">IUCA Community</a>

        <!-- Центр: Место под будущие ссылки (Лента, Расписание, Клубы) -->
        <div class="navbar-menu">
            <!-- Сюда в будущем добавим ссылки -->
        </div>

        <!-- Правый верхний угол -->
        <div class="navbar-user">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="user-link">
                    👤 {{ user.full_name|default:user.username }}
                </a>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" style="color: white; text-decoration: none;">Войти</a>
            {% endif %}
        </div>
    </nav>

    <!-- Основное содержимое страниц -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
