<h2>Вход в систему</h2>

{% if form.errors %}
    <div style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 15px; background-color: #ffe6e6;">
        <strong>Неверный логин или пароль!</strong>
    </div>
{% endif %}

{% if messages %}
    {% for message in messages %}
        <div style="padding: 10px; margin-bottom: 15px; color: green; border: 1px solid green;">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Войти</button>
</form>

<p>Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
